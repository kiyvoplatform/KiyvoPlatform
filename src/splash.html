<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiyvo</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}
.splash{position:relative;width:100%;height:100%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.09);border-radius:28px;overflow:hidden;background:linear-gradient(145deg,rgba(12,13,20,.98),rgba(20,15,42,.98));box-shadow:0 30px 90px rgba(0,0,0,.62)}
.splash:before,.splash:after{content:"";position:absolute;border-radius:999px;filter:blur(60px);opacity:.5;animation:drift 4s ease-in-out infinite alternate}.splash:before{width:240px;height:240px;left:-70px;top:-100px;background:#8b2cff}.splash:after{width:230px;height:230px;right:-80px;bottom:-110px;background:#079cff;animation-delay:.5s}
.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:35px 35px;mask-image:linear-gradient(to bottom,transparent,#000,transparent)}
.content{position:relative;z-index:2;display:grid;justify-items:center;gap:13px;text-align:center}.logo-wrap{position:relative;width:112px;height:112px;display:grid;place-items:center}.halo{position:absolute;inset:0;border-radius:35px;background:linear-gradient(135deg,rgba(181,39,255,.28),rgba(0,172,255,.2));filter:blur(12px);animation:pulse 1.7s ease-in-out infinite}.logo{position:relative;width:88px;height:88px;object-fit:contain;opacity:0;transform:scale(.72);animation:logoIn .9s cubic-bezier(.2,.9,.2,1) .12s forwards, float 2.4s ease-in-out 1s infinite}
h1{margin:0;font-size:30px;letter-spacing:-.045em}p{margin:0;color:#aeb5c8;font-size:13px}.version{margin-top:6px;color:#727b91;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.loader{width:210px;height:3px;margin-top:13px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.loader i{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#9b3cff,#5b5cff,#18b8ff);animation:load 1.25s ease-in-out infinite}.status{min-height:18px;color:#cfd3df;font-size:12px;animation:fadeText .7s ease}
@keyframes logoIn{to{opacity:1;transform:scale(1)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes pulse{50%{transform:scale(1.1);opacity:.8}}@keyframes drift{to{transform:translate(35px,25px) scale(1.12)}}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(370%)}}@keyframes fadeText{from{opacity:.25}to{opacity:1}}
</style>
</head>
<body>
<div class="splash">
  <div class="grid"></div>
  <div class="content">
    <div class="logo-wrap"><div class="halo"></div><img class="logo" src="../assets/icon.png" alt="Kiyvo"></div>
    <h1>Kiyvo</h1>
    <p>Watch. Create. Connect.</p>
    <div class="loader"><i></i></div>
    <div class="status" id="status">Starting Kiyvo…</div>
    <div class="version" id="version">Desktop</div>
  </div>
</div>
<audio id="startup" src="../assets/startup.wav" preload="auto"></audio>
<script>
const params=new URLSearchParams(location.search);document.getElementById('version').textContent=`Desktop ${params.get('version')||''}`;
const statuses=['Starting Kiyvo…','Restoring your session…','Connecting to your Kiyvo server…','Almost ready…'];let index=0;
setInterval(()=>{index=Math.min(index+1,statuses.length-1);const node=document.getElementById('status');node.style.opacity='.2';setTimeout(()=>{node.textContent=statuses[index];node.style.opacity='1'},140)},520);
window.addEventListener('DOMContentLoaded',()=>{const audio=document.getElementById('startup');audio.volume=.22;audio.play().catch(()=>{});});
</script>
</body>
</html>
