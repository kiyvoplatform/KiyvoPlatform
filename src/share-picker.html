<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share with Kiyvo</title>
<style>
:root{color-scheme:dark;--bg:#090a0f;--panel:#11131a;--panel2:#171a23;--line:#292d3a;--muted:#9399aa;--text:#f7f7fb;--purple:#7652ff;--purple2:#9b6dff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:radial-gradient(circle at 78% -15%,rgba(119,75,255,.18),transparent 34%),var(--bg)}
header{height:54px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07);-webkit-app-region:drag}header img{width:27px;height:27px}header strong{font-size:15px}header span{color:#777e90;font-size:12px;margin-left:4px}.close{margin-left:auto;width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#a7adbd;font-size:20px;cursor:pointer;-webkit-app-region:no-drag}.close:hover{background:#252936;color:#fff}
.intro{padding:20px 22px 14px}.intro h1{font-size:24px;margin:0 0 6px;letter-spacing:-.035em}.intro p{margin:0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:7px;padding:0 22px 13px}.tab{border:1px solid var(--line);background:#12141b;color:#aeb4c3;border-radius:9px;padding:8px 13px;font-weight:700;font-size:12px;cursor:pointer}.tab.active{background:rgba(118,82,255,.16);border-color:rgba(139,102,255,.52);color:#fff}
.grid{min-height:0;overflow:auto;padding:3px 22px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}.card{border:1px solid var(--line);background:linear-gradient(145deg,#13161e,#0f1117);border-radius:13px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0;transition:.14s transform,.14s border-color,.14s box-shadow}.card:hover{transform:translateY(-1px);border-color:#454b60}.card.selected{border-color:#8f6bff;box-shadow:0 0 0 2px rgba(126,88,255,.2),0 12px 34px rgba(0,0,0,.3)}.thumb{aspect-ratio:16/9;background:#06070b;display:grid;place-items:center;overflow:hidden;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.screen-badge{position:absolute;left:8px;top:8px;padding:4px 7px;border-radius:6px;background:rgba(4,5,9,.8);border:1px solid rgba(255,255,255,.1);font-size:9px;font-weight:850;letter-spacing:.08em}.meta{padding:10px 11px 11px;display:flex;align-items:center;gap:9px;min-width:0}.meta img{width:20px;height:20px;object-fit:contain;border-radius:5px}.meta div{min-width:0}.meta strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{display:block;margin-top:2px;color:#858c9e;font-size:10px}
footer{height:66px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(13,15,21,.96)}.selection{min-width:0;color:#939aab;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:9px}.btn{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 15px;background:#1a1d26;color:#fff;font-weight:800;cursor:pointer}.btn:hover{background:#252936}.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 8px 22px rgba(118,82,255,.28)}.btn.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><img src="../assets/icon.png" alt=""><strong>Kiyvo</strong><span>Screen Share</span><button class="close" id="close" aria-label="Close">×</button></header>
<section class="intro"><h1>Choose what to share</h1><p>Only the display or application you select will be visible to viewers.</p></section>
<nav class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="screen">Displays</button><button class="tab" data-filter="window">Windows</button></nav>
<main class="grid" id="grid"><div class="empty">Loading available screens and windows…</div></main>
<footer><div class="selection" id="selection">Nothing selected</div><div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="share" disabled>Share</button></div></footer>
<script>
(() => {
  const api=window.kiyvoSharePicker, grid=document.getElementById('grid'), selection=document.getElementById('selection'), share=document.getElementById('share');
  let sources=[], selected='', filter='all';
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function typeOf(s){return String(s.id||'').startsWith('screen:')?'screen':'window'}
  function draw(){const visible=sources.filter(s=>filter==='all'||typeOf(s)===filter);grid.innerHTML=visible.length?visible.map(s=>`<button class="card ${selected===s.id?'selected':''}" data-id="${esc(s.id)}"><div class="thumb"><img src="${esc(s.thumbnail)}" alt=""><span class="screen-badge">${typeOf(s)==='screen'?'DISPLAY':'WINDOW'}</span></div><div class="meta">${s.appIcon?`<img src="${esc(s.appIcon)}" alt="">`:''}<div><strong>${esc(s.name)}</strong><small>${typeOf(s)==='screen'?'Entire display':'Application window'}</small></div></div></button>`).join(''):'<div class="empty">No sources available in this category.</div>';grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>{selected=c.dataset.id;selection.textContent=sources.find(s=>s.id===selected)?.name||'Selected source';share.disabled=false;draw();});}
  api.onSources(list=>{sources=list;draw()});
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.filter;draw();});
  share.onclick=()=>selected&&api.select(selected);document.getElementById('cancel').onclick=()=>api.cancel();document.getElementById('close').onclick=()=>api.cancel();
  document.addEventListener('keydown',e=>{if(e.key==='Escape')api.cancel();if(e.key==='Enter'&&selected)api.select(selected)});
})();
</script>
</body>
</html>
