<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiyvo Screen Share</title>
<style>
:root{color-scheme:dark;--bg:#08090e;--panel:#11131a;--panel2:#171a23;--line:#292d3a;--muted:#9399aa;--text:#f7f7fb;--purple:#7652ff;--purple2:#9b6dff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:58px auto minmax(0,1fr) 72px;background:radial-gradient(circle at 78% -15%,rgba(119,75,255,.2),transparent 34%),var(--bg)}
header{display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(13,14,21,.88);-webkit-app-region:drag}header img{width:29px;height:29px;object-fit:contain}header strong{font-size:15px}header span{color:#858b9b;font-size:12px}.close{margin-left:auto;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:#a7adbd;font-size:20px;cursor:pointer;-webkit-app-region:no-drag}.close:hover{background:#252936;color:#fff}
.top{padding:20px 24px 14px;display:flex;align-items:end;justify-content:space-between;gap:18px}.intro h1{font-size:26px;margin:0 0 6px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted);font-size:13px}.count{font-size:11px;color:#a7adbd;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#11131a;white-space:nowrap}
.tabs{display:flex;gap:7px;margin-top:14px}.tab{border:1px solid var(--line);background:#12141b;color:#aeb4c3;border-radius:9px;padding:8px 13px;font-weight:800;font-size:12px;cursor:pointer}.tab.active{background:rgba(118,82,255,.16);border-color:rgba(139,102,255,.52);color:#fff}
.grid{min-height:0;overflow:auto;padding:2px 24px 22px;display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;align-content:start;scrollbar-color:#343847 transparent}.card{position:relative;border:1px solid var(--line);background:linear-gradient(145deg,#13161e,#0f1117);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0;transition:.14s transform,.14s border-color,.14s box-shadow}.card:hover{transform:translateY(-1px);border-color:#4a5065}.card.selected{border-color:#9475ff;box-shadow:0 0 0 2px rgba(126,88,255,.23),0 14px 36px rgba(0,0,0,.32)}
.thumb{aspect-ratio:16/9;background:#05060a;display:grid;place-items:center;overflow:hidden;position:relative;padding:5px}.thumb img{width:100%;height:100%;object-fit:contain;object-position:center;border-radius:7px;background:#05060a}.screen-badge{position:absolute;left:10px;top:10px;padding:4px 7px;border-radius:6px;background:rgba(4,5,9,.86);border:1px solid rgba(255,255,255,.11);font-size:9px;font-weight:900;letter-spacing:.08em}.check{display:none;position:absolute;right:10px;top:10px;width:25px;height:25px;border-radius:999px;background:#7b5cff;place-items:center;font-weight:900;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3)}.selected .check{display:grid}.meta{padding:11px 12px 12px;display:flex;align-items:center;gap:9px;min-width:0}.meta img{width:22px;height:22px;object-fit:contain;border-radius:5px}.meta div{min-width:0}.meta strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{display:block;margin-top:2px;color:#858c9e;font-size:10px}
footer{border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(13,15,21,.97);gap:18px}.selection{min-width:0;color:#939aab;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selection strong{color:#fff}.actions{display:flex;gap:9px;flex:0 0 auto}.btn{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 17px;background:#1a1d26;color:#fff;font-weight:800;cursor:pointer}.btn:hover{background:#252936}.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 8px 22px rgba(118,82,255,.28)}.btn.primary:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.empty{grid-column:1/-1;padding:80px 20px;text-align:center;color:var(--muted)}
@media(min-width:1400px){.grid{grid-template-columns:repeat(4,minmax(250px,1fr))}}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(250px,1fr))}}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.count{display:none}}
</style>
</head>
<body>
<header><img src="../assets/icon.png" alt=""><strong>Kiyvo</strong><span>Screen Share</span><button class="close" id="close" aria-label="Close">×</button></header>
<section class="top"><div class="intro"><h1>Choose what to share</h1><p>The full display or application window will be shown in every preview — nothing is cropped.</p><nav class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="screen">Displays</button><button class="tab" data-filter="window">Windows</button></nav></div><div class="count" id="count">Finding sources…</div></section>
<main class="grid" id="grid"><div class="empty">Loading available screens and windows…</div></main>
<footer><div class="selection" id="selection">Nothing selected</div><div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="share" disabled>Share screen</button></div></footer>
<script>
(() => {
  const api=window.kiyvoSharePicker, grid=document.getElementById('grid'), selection=document.getElementById('selection'), share=document.getElementById('share'), count=document.getElementById('count');
  let sources=[], selected='', filter='all';
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const typeOf=s=>String(s.id||'').startsWith('screen:')?'screen':'window';
  function draw(){
    const visible=sources.filter(s=>filter==='all'||typeOf(s)===filter);
    count.textContent=`${visible.length} ${visible.length===1?'source':'sources'}`;
    grid.innerHTML=visible.length?visible.map(s=>`<button class="card ${selected===s.id?'selected':''}" data-id="${esc(s.id)}" title="${esc(s.name)}"><div class="thumb"><img src="${esc(s.thumbnail)}" alt=""><span class="screen-badge">${typeOf(s)==='screen'?'DISPLAY':'WINDOW'}</span><span class="check">✓</span></div><div class="meta">${s.appIcon?`<img src="${esc(s.appIcon)}" alt="">`:''}<div><strong>${esc(s.name)}</strong><small>${typeOf(s)==='screen'?'Entire display':'Application window'}</small></div></div></button>`).join(''):'<div class="empty">No sources available in this category.</div>';
    grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>{selected=c.dataset.id;const name=sources.find(s=>s.id===selected)?.name||'Selected source';selection.innerHTML=`Sharing: <strong>${esc(name)}</strong>`;share.disabled=false;draw();});
  }
  api.onSources(list=>{sources=list;draw()});
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.filter;draw();});
  share.onclick=()=>selected&&api.select(selected);document.getElementById('cancel').onclick=()=>api.cancel();document.getElementById('close').onclick=()=>api.cancel();
  document.addEventListener('keydown',e=>{if(e.key==='Escape')api.cancel();if(e.key==='Enter'&&selected)api.select(selected)});
})();
</script>
</body>
</html>
